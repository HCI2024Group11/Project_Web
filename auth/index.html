<style>
    body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  background-color: #f0f0f0; /* Màu nền nếu cần */
}

.form-container {
  width: 380px;
  height: auto;
  background-color: #fff;
  box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
  border-radius: 10px;
  box-sizing: border-box;
  padding: 20px 30px;
}

.title {
  text-align: center;
  font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
  margin: 10px 0 30px 0;
  font-size: 28px;
  font-weight: 800;
}

.sub-title {
  margin: 0;
  margin-bottom: 5px;
  font-size: 14px;
  font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
}

.form {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin-bottom: 15px;
}

.input {
  border-radius: 20px;
  border: 1px solid #c0c0c0;
  outline: 0 !important;
  box-sizing: border-box;
  padding: 12px 15px;
  font-size: 16px;
}

.form-btn {
  padding: 10px 15px;
  font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
  border-radius: 20px;
  border: 0 !important;
  outline: 0 !important;
  background: teal;
  color: white;
  cursor: pointer;
  font-size: 16px;
  box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
}

.form-btn:active {
  box-shadow: none;
}

.switch-link {
  margin: 0;
  font-size: 16px;
  color: #747474;
  font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
  text-align: center;
}

.switch-link span {
  margin-left: 1px;
  font-size: 16px;
  text-decoration: underline;
  text-decoration-color: teal;
  color: teal;
  cursor: pointer;
  font-weight: 800;
}

.buttons-container {
  width: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  margin-top: 20px;
  gap: 15px;
}

.apple-login-button,
    .google-login-button,
    .facebook-login-button {
  border-radius: 20px;
  box-sizing: border-box;
  padding: 10px 15px;
  box-shadow: rgba(0, 0, 0, 0.16) 0px 10px 36px 0px,
        rgba(0, 0, 0, 0.06) 0px 0px 0px 1px;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
  font-size: 16px;
  gap: 5px;
}

.apple-login-button {
  background-color: #000;
  color: #fff;
  border: 2px solid #000;
}

.google-login-button {
  border: 2px solid #747474;
}

.facebook-login-button {
  background-color: #3b5998;
  color: #fff;
  border: 2px solid #3b5998;
}
</style>

    <p class="sub-title">Start improving your English skills today!</p>
    <form class="form" id="user-form">

      <input type="password" class="input" placeholder="Password">
      <button type="button" class="form-btn" id="form-btn">Create account</button>

<script>
  const formTitle = document.getElementById("form-title");
  const userForm = document.getElementById("user-form");
  const switchToLogin = document.getElementById("switch-to-login");
  const formBtn = document.getElementById("form-btn");

  switchToLogin.addEventListener("click", () => {
    const isLogin = formTitle.textContent === "Log in";

    if (isLogin) {
      formTitle.textContent = "Create account";
      formBtn.textContent = "Create account";
      switchToLogin.textContent = "Log in";
      document.getElementById("name-input").style.display = "block";
    } else {
      formTitle.textContent = "Log in";
      formBtn.textContent = "Log in";
      switchToLogin.textContent = "Sign up";
      document.getElementById("name-input").style.display = "none";
    }
  });

  // Danh sách các ID của nút
const buttonIds = [
    'apple-login-button', 
    'facebook-login-button', 
    'google-login-button', 
    'button',
    'form-btn'
];

// URL đích
const targetUrl = 'https://hci2024group11.github.io/Project_Web/';

// Hàm để gắn sự kiện click cho mỗi nút
buttonIds.forEach(id => {
    const button = document.getElementById(id);
    if (button) { // Kiểm tra xem nút có tồn tại không
        button.addEventListener('click', () => {
            window.location.href = targetUrl; // Chuyển hướng tới URL đích
        });
    } else {
        console.warn(`Không tìm thấy nút với ID: ${id}`);
    }
});
</script>
